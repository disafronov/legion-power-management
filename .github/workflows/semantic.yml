---
name: Semantic

"on":
  pull_request:
    branches:
      - main
      - rc
  push:
    branches:
      - main
      - rc

env:
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  rebase:
    name: "Rebase"
    runs-on: ubuntu-latest
    # Runs when: push to main with commit message starting with "chore(release):"
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'chore(release):')
    concurrency:
      group: push-rebase-main
      cancel-in-progress: false
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: "Rebase all non-draft non-dependencies pull requests"
        uses: peter-evans/rebase@v4.0.0
        with:
          base: main
          exclude-drafts: true
          exclude-labels: dependencies

  validate:
    name: "Validate"
    runs-on: ubuntu-latest
    concurrency:
      group: semantic-validate-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # Runs when: pull_request targeting main or rc
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Semantic release dry run
        run: |
          docker run --rm \
            --user 1001 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ghcr.io/disafronov/semantic-release:${{ vars.SEMANTIC_RELEASE_TAG || 'latest' }} \
            --dry-run

  release:
    name: "Release"
    runs-on: ubuntu-latest
    # Runs when: push to main or rc
    if: >-
      github.event_name == 'push' && (
        github.ref == 'refs/heads/rc' ||
        github.ref == 'refs/heads/main'
      )
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: semantic-release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.SEMANTIC_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Semantic release
        run: |
          docker run --rm \
            --user 1001 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e GITHUB_TOKEN=${{ secrets.SEMANTIC_RELEASE_TOKEN || secrets.GITHUB_TOKEN }} \
            -e CI=true \
            ghcr.io/disafronov/semantic-release:${{ vars.SEMANTIC_RELEASE_TAG || 'latest' }}
